<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fogones">
<meta name="theme-color" content="#2b1d3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}body{margin:0}</style>
<title>Guerra de Fogones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: una pantalla de móvil: barra de caja arriba, la calle animada en el centro, misión + pestañas + panel abajo */
:root{
  --bg:#2b1d3a; --bg2:#3a2950; --cream:#fff6e8; --cream2:#f3e2c4; --ink:#3b2a1a; --mute:#8a7357;
  --orange:#f2a541; --orange2:#e0862a; --green:#3bb273; --green2:#2e9160; --red:#e4572e; --blue:#3a86c8; --gold:#ffd166;
  --f-display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Nunito',-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:#fff;font-family:var(--f-body);font-size:14px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 50% 0%,#4a3366,transparent 60%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:520px;margin:0 auto;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding-block:6px 4px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cash{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;background:rgba(0,0,0,.28);border-radius:14px;padding:6px 12px}
.cash b{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #9a6b00;white-space:nowrap}
.cash small{font-weight:900;color:#c9b8e6;font-size:12px;white-space:nowrap}
.cash.bump b{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.08)}}
.fame{background:rgba(0,0,0,.28);border-radius:14px;padding:8px 10px;font-weight:900;white-space:nowrap}
.icb{width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.28);font-size:18px;display:grid;place-items:center;flex-shrink:0}
.stage{position:relative;flex:1 1 auto;min-height:150px;display:flex;justify-content:center;align-items:center}
#cv{display:block;touch-action:none;border-radius:14px}
.boosts{position:absolute;right:calc(50% - var(--cw,400px)/2 + 6px);top:4px;display:flex;gap:6px;z-index:3}
.boost{position:relative;width:38px;height:38px;border-radius:50%;background:var(--cream);font-size:19px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35);color:var(--ink)}
.boost i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(43,29,58,.72) calc(var(--cd,0)*360deg),transparent 0)}
.boost b{position:absolute;bottom:-4px;right:-4px;font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;font-family:var(--f-body)}
.boost.ready{animation:wob 2s infinite}
.boost.on{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(12deg)}95%{transform:rotate(-6deg)}}
.ticker{position:absolute;left:50%;top:calc(50% - var(--ch,300px)/2 + 48px);transform:translate(-50%,-10px);opacity:0;background:rgba(43,29,58,.92);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:6px 12px;font-weight:800;font-size:12.5px;max-width:92%;text-align:center;transition:.3s;pointer-events:none;z-index:4}
.ticker.on{opacity:1;transform:translate(-50%,0)}
.big{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.big div{font-family:var(--f-display);font-size:28px;text-align:center;color:#fff;text-shadow:0 3px 0 #000,0 0 20px rgba(0,0,0,.6);animation:slam .5s cubic-bezier(.2,1.6,.4,1) both;line-height:1.1;padding:0 10px}
.big div small{display:block;font-size:15px;font-family:var(--f-body);font-weight:900;margin-top:6px}
.big.out div{animation:fadeo .5s forwards}
@keyframes slam{from{transform:scale(2.6);opacity:0}}
@keyframes fadeo{to{opacity:0;transform:scale(.9)}}
.mission{flex-shrink:0;display:flex;align-items:center;gap:10px;background:var(--cream);color:var(--ink);border-radius:14px;padding:7px 10px;min-height:40px;box-sizing:border-box}
.mission .mi{font-size:20px}
.mission .mt{flex:1;min-width:0;font-weight:900;font-size:13px;line-height:1.2}
.mission .mt small{display:block;font-weight:800;color:var(--mute);font-size:11px}
.mission .pb{height:6px;background:var(--cream2);border-radius:99px;overflow:hidden;margin-top:3px}
.mission .pb i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.mission button{background:var(--green);color:#fff;font-family:var(--f-display);font-size:15px;padding:7px 12px;border-radius:10px;box-shadow:0 3px 0 var(--green2);animation:pulse 1s infinite;white-space:nowrap}
@keyframes pulse{50%{transform:scale(1.06)}}
.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tabs button{position:relative;background:rgba(0,0,0,.28);border-radius:12px;padding:7px 2px;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button span{font-size:18px;line-height:1}
.tabs button.on{background:var(--cream);color:var(--ink)}
.tabs button .dot{position:absolute;top:4px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.panel{flex:0 0 auto;height:clamp(150px,29dvh,270px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--cream);color:var(--ink);border-radius:16px;padding:8px;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:9px;background:#fff;border-radius:12px;padding:7px 8px;box-shadow:0 2px 0 var(--cream2)}
.row .ic{font-size:28px;width:36px;text-align:center;flex-shrink:0;line-height:1}
.row .ic.lock{filter:grayscale(1) opacity(.5)}
.row .tx{flex:1;min-width:0;line-height:1.2}
.row .tx b{font-weight:900;font-size:14px;display:block}
.row .tx small{color:var(--mute);font-weight:800;font-size:11.5px;display:block}
.row .ms{height:5px;background:var(--cream2);border-radius:99px;margin-top:3px;overflow:hidden}
.row .ms i{display:block;height:100%;background:var(--blue)}
.btn{background:var(--green);color:#fff;font-family:var(--f-display);font-size:14px;line-height:1.05;padding:8px 10px;border-radius:11px;box-shadow:0 3px 0 var(--green2);min-width:84px;text-align:center;flex-shrink:0;touch-action:none}
.btn small{display:block;font-family:var(--f-body);font-weight:900;font-size:10px;opacity:.9}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green2)}
.btn:disabled,.btn.no{background:#c8b9a2;box-shadow:0 3px 0 #a8987f}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 var(--orange2)}
.btn.red{background:var(--red);box-shadow:0 3px 0 #b03d1c}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.ph b{font-family:var(--f-display);font-weight:400;font-size:17px}
.seg{display:flex;background:var(--cream2);border-radius:10px;padding:2px}
.seg button{padding:4px 9px;border-radius:8px;font-weight:900;font-size:12px}
.seg button.on{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.note{font-size:12px;font-weight:800;color:var(--mute);line-height:1.35;padding:0 2px}
.pm{display:flex;align-items:center;gap:4px;flex-shrink:0}
.pm button{width:34px;height:34px;border-radius:10px;background:var(--cream2);font-family:var(--f-display);font-size:20px;touch-action:none}
.pm button:active{background:var(--orange);color:#fff}
.pm .pv{min-width:58px;text-align:center;font-weight:900;line-height:1.1}
.pm .pv small{display:block;font-size:10.5px;font-weight:900}
.lab-g{color:var(--green)}.lab-o{color:var(--orange2)}.lab-r{color:var(--red)}.lab-b{color:var(--blue)}
.dem{display:flex;gap:2px;margin-top:3px}.dem i{width:10px;height:5px;border-radius:2px;background:var(--cream2)}.dem i.on{background:var(--green)}
.share{display:flex;height:22px;border-radius:8px;overflow:hidden;box-shadow:0 2px 0 var(--cream2)}
.share div{display:grid;place-items:center;color:#fff;font-weight:900;font-size:11px;min-width:0;overflow:hidden;transition:flex .5s}
.hb{height:7px;border-radius:99px;background:var(--cream2);overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;border-radius:99px;transition:width .5s}
.toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:#fff;color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:900;max-width:min(90vw,400px);text-align:center;transition:.25s;z-index:60;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,10,30,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--cream);color:var(--ink);border-radius:22px;padding:20px 16px 16px;width:min(100%,400px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:rise .3s cubic-bezier(.3,1.4,.5,1);box-shadow:0 8px 0 var(--cream2)}
@keyframes rise{from{transform:translateY(24px) scale(.95);opacity:0}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:28px;text-align:center;margin:0;line-height:1.1}
.sheet p{margin:0;line-height:1.45;font-weight:700}
.sheet .bigbtn{background:var(--green);color:#fff;font-family:var(--f-display);font-size:20px;padding:13px;border-radius:14px;box-shadow:0 4px 0 var(--green2);width:100%}
.sheet .ghost{border:2px solid var(--cream2);font-weight:900;padding:11px;border-radius:14px;width:100%}
.sheet ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.sheet li{background:#fff;border-radius:12px;padding:8px 10px;font-weight:800;line-height:1.35;font-size:13.5px}
.emo{font-size:46px;text-align:center;line-height:1}
.tog{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:11px 12px;font-weight:900;width:100%}
.tog i{width:44px;height:26px;border-radius:99px;background:var(--cream2);position:relative;transition:.2s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.2s}
.tog.on i{background:var(--green)}.tog.on i::after{left:21px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <header class="top">
    <div class="cash" id="cashBox"><b id="money">0</b><small id="inc">+0/s</small></div>
    <div class="fame" id="fameBox">⭐ <span id="fame">0</span></div>
    <button class="icb" id="setBtn" aria-label="Ajustes">⚙️</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="boosts">
      <button class="boost" id="bTurbo" aria-label="Turbo cocina">🔥<i></i></button>
      <button class="boost" id="bRush" aria-label="Hora punta">📣<i></i></button>
    </div>
    <div class="ticker" id="ticker"></div>
    <div class="big" id="big" hidden></div>
  </div>
  <div class="mission" id="mission"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="cocina" class="on"><span>🍳</span>Cocina</button>
    <button data-tab="precios"><span>💲</span>Precios</button>
    <button data-tab="equipo"><span>👨‍🍳</span>Equipo</button>
    <button data-tab="calle"><span>🏙️</span>Calle</button>
  </nav>
  <div class="panel" id="panel"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
// ================= GUERRA DE FOGONES · simulación =================
const VW=400,VH=345,STREET=86,SIDE_Y=66,ZW=100;
const DISH={
  soda:{e:'🥤',n:'Refresco',p:5,t:1.6,unlock:0},
  fries:{e:'🍟',n:'Patatas',p:12,t:2.6,unlock:60},
  burger:{e:'🍔',n:'Hamburguesa',p:30,t:4,unlock:600},
  wine:{e:'🍷',n:'Vino',p:22,t:2.2,unlock:900},
  pizza:{e:'🍕',n:'Pizza',p:40,t:5,unlock:2500},
  pasta:{e:'🍝',n:'Pasta',p:60,t:5.5,unlock:6000},
  tea:{e:'🍵',n:'Té matcha',p:110,t:2.4,unlock:2.2e4},
  sushi:{e:'🍣',n:'Sushi',p:180,t:5,unlock:6e4},
  ramen:{e:'🍜',n:'Ramen',p:260,t:6,unlock:1.4e5},
  marga:{e:'🍹',n:'Margarita',p:450,t:3,unlock:5e5},
  taco:{e:'🌮',n:'Tacos',p:700,t:4.5,unlock:1.2e6},
  burrito:{e:'🌯',n:'Burrito',p:1000,t:6,unlock:2.8e6}};
const ZONES=[
  {name:'Tu local',e:'🥤',col:'#f2a541',dishes:['soda','fries','burger']},
  {name:'Mamma Mia',e:'🍕',col:'#d1495b',dishes:['wine','pizza','pasta'],cash:300,base:1.1,runway:200,buy:2500},
  {name:'Sushi Zen',e:'🍣',col:'#3a86c8',dishes:['tea','sushi','ramen'],cash:2e4,base:1.9,runway:420,buy:2.5e4},
  {name:'El Güey',e:'🌮',col:'#3bb273',dishes:['marga','taco','burrito'],cash:1e6,base:2.6,runway:700,buy:2.5e5}];
const MILES=[10,25,50,75,100,150,200,300];
const milesOf=L=>MILES.filter(m=>L>=m).length;
const qual=L=>0.62*Math.log2(1+L);
const fairOf=(d,L)=>DISH[d].p*(1+0.11*(L-1))*Math.pow(1.8,milesOf(L));
const cookOf=(d,L)=>DISH[d].t/(1+0.45*milesOf(L));
const upCost=(d,L)=>Math.ceil(DISH[d].p*1.3*Math.pow(1.115,L-1)*(1+0.15*milesOf(L)));
const chefCost=n=>Math.ceil(60*Math.pow(3.2,n-1));
const seatCost=n=>Math.ceil(400*Math.pow(6,n-4));
const speedCost=n=>Math.ceil(150*Math.pow(2.6,n));
const fmtM=n=>{n=Math.floor(n);if(n<1e4)return n.toLocaleString('es-ES');const u=['K','M','B','T','aa','ab','ac'];let i=-1;while(n>=1e3&&i<u.length-1){n/=1e3;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0)).replace('.',',')+u[i]};

function newState(fr=0){
  const st={};for(const k in DISH)st[k]={lvl:0,r:1};st.soda.lvl=1;
  return{v:1,money:30,fame:0,fr,st,chefs:1,speed:0,seats:4,
    zones:ZONES.map((z,i)=>i===0?{own:1}:{own:0,open:1,cash:z.cash*(1+fr*3),lvl:0,r:1,closedAt:0}),
    mis:0,earned:0,served:0,lastSave:Date.now(),incAvg:0,cd:{turbo:0,rush:0},seen:0,sound:1,music:1};
}

// ---- geometría (coordenadas virtuales) ----
function zoneGeo(j){const x0=j*ZW,cx=x0+ZW/2,y0=STREET,h=VH-STREET;
  const ty=[y0+.27*h,y0+.44*h,y0+.61*h];
  const seats=[];ty.forEach(y=>{seats.push({x:cx-26,y},{x:cx+26,y})});
  return{x0,cx,y0,h,door:{x:cx,y:y0+14},seats,tables:ty,counterY:y0+.75*h,stations:[0,1,2].map(k=>({x:x0+ZW*(k*2+1)/6,y:y0+.89*h})),home:{x:cx,y:y0+.73*h}}}
const GEO=[0,1,2,3].map(zoneGeo);

// ---- runtime ----
function newRuntime(S){
  const R={custs:[],chefs:[],orders:[],floats:[],bags:[],spawnAcc:0,passAcc:0,t:0,tick:0,
    seats:GEO.map(g=>g.seats.map(()=>null)),stationBusy:{},events:[],news:[],turbo:0,rush:0,rivalSvc:[0,7,8,9],
    salesWin:[],incWin:0,incT:0,critic:0,lastBag:0};
  for(let i=0;i<S.chefs;i++)R.chefs.push(mkChef(S,i));
  return R}
function mkChef(S,i){const owned=S.zones.map((z,j)=>z.own?j:-1).filter(j=>j>=0);const g=GEO[owned[i%owned.length]];
  return{x:g.home.x+(i%3-1)*14,y:g.home.y,state:'idle',order:null,prog:0,carry:null,bob:Math.random()*6}}
const ownedZones=S=>S.zones.map((z,j)=>z.own?j:-1).filter(j=>j>=0);
const myDishes=S=>Object.keys(DISH).filter(d=>S.st[d].lvl>0&&ownedZones(S).some(j=>ZONES[j].dishes.includes(d)));
function stationPos(d){for(let j=0;j<4;j++){const k=ZONES[j].dishes.indexOf(d);if(k>=0)return{...GEO[j].stations[k],j,k}}}
const seatCap=(S,j)=>S.zones[j].own?S.seats:4;
function gumbel(){return-Math.log(-Math.log(Math.random()+1e-9)+1e-9)}

const rivalCash0=(j,S)=>ZONES[j].cash*(1+S.fr*3);
const rivalFixed=(j,S)=>rivalCash0(j,S)/ZONES[j].runway;
function myUtil(S,R,d){const s=S.st[d];return qual(s.lvl)+0.005*S.fame+(R.ad>0?0.5:0)+0.07*(myDishes(S).length-1)-2.4*(s.r-1)}
function rivalUtil(S,j){const z=S.zones[j];return ZONES[j].base+0.2*z.lvl+0.15*S.fr-2.4*(z.r-1)}

function freeSeat(S,R,j){const cap=seatCap(S,j);for(let k=0;k<cap;k++)if(!R.seats[j][k])return k;return-1}
function spawnCustomer(S,R,opts={}){
  const side=Math.random()<.5,x=side?-12:VW+12;
  const c={x,y:SIDE_Y+(Math.random()*10-5),dir:side?1:-1,e:CUST[Math.floor(Math.random()*CUST.length)],state:'walk',target:-1,seat:-1,dish:null,wait:0,mood:'',vip:!!opts.vip,speed:48+Math.random()*16};
  // decidir
  let best=0+gumbel(),pick=null;
  const mySeatZ=ownedZones(S).map(j=>[j,freeSeat(S,R,j)]).filter(a=>a[1]>=0);
  const md=myDishes(S);
  if(mySeatZ.length&&md.length){for(const d of md){const u=myUtil(S,R,d)+gumbel()+(c.vip?0.5:0);if(u>best){best=u;pick={me:1,d}}}}
  let hurt=false;
  for(let j=1;j<4;j++){const z=S.zones[j];if(z.own||!z.open)continue;const k=freeSeat(S,R,j);if(k<0)continue;
    const u=rivalUtil(S,j)+gumbel();if(u>best){best=u;pick={j}}}
  if(pick&&pick.me){
    // elige la zona libre más cercana a la puerta por la que pasa
    const [j,k]=mySeatZ.sort((a,b)=>Math.abs(GEO[a[0]].cx-x)-Math.abs(GEO[b[0]].cx-x))[0];
    c.target=j;c.seat=k;c.dish=pick.d;R.seats[j][k]=c;c.state='toDoor';
  }else if(pick){const j=pick.j,k=freeSeat(S,R,j);c.target=j;c.seat=k;R.seats[j][k]=c;c.state='toDoor';
    c.dish=ZONES[j].dishes[Math.floor(Math.random()*3)]}
  else{if(md.length&&md.some(d=>S.st[d].r>1.35))c.mood='💸';}
  R.custs.push(c);return c}

  if(k==='buy'){const j=+x;if(!buyZone(S,R,j)){sfx.bad();return false}dirtyBg=true;const g=GEO[j];
    bigText(`${ZONES[j].e} ¡LOCAL COMPRADO!`,'Pared fuera: ahora la calle es más tuya');sfx.big();for(let i=0;i<3;i++)setTimeout(()=>burst(g.cx,g.y0+60+i*80,26,'🎉'),i*250);save();return true}
  if(k==='fran'){openModal(`<div class="emo">🏢</div><h2>¿Abrir franquicia?</h2><p style="text-align:center">Vendes la calle y empiezas otra desde cero. Ganarás <b>x${S.fr+2}</b> por cada plato para siempre, pero los rivales serán más duros.</p><button class="bigbtn" data-m="franOk">¡Franquiciar!</button><button class="ghost" data-m="close">Todavía no</button>`);return false}
  return false}
MA.franOk=()=>{if(S.money<franCost())return;const fr=S.fr+1,keep={sound:S.sound,music:S.music,mis:S.mis,seen:1};S=newState(fr);Object.assign(S,keep);S.flags={};R=newRuntime(S);hook();dirtyBg=true;closeModal();bigText('🏢 ¡FRANQUICIA '+(fr+1)+'!','Nueva calle, más dinero, rivales más duros');sfx.big();save();renderPanel()};
function hook(){R.onCoin=()=>{sfx.coin();const b=$('#cashBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')};R.onAngry=()=>sfx.bad();R.onNews=t=>news(t);
  R.onClose=j=>{S.flags['closed'+j]=1;bigText(`${ZONES[j].e} ¡${ZONES[j].name.toUpperCase()} CIERRA!`,'Cómpralo en 🏙️ Calle antes de que reabra');sfx.big();dirtyBg=true;tabDot('calle',true)}}
// pulsar / mantener en el panel
let pd=null;
$('#panel').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a]');panelDown=true;if(!b)return;
  pd={a:b.dataset.a,hold:!!b.dataset.hold,x:e.clientX,y:e.clientY,fired:false,el:b};
  if(pd.hold)pd.timer=setTimeout(()=>{pd.fired=true;let n=0;const go=()=>{if(!pd)return;if(act(pd.a)){n++;renderPanelForce()}pd.timer=setTimeout(go,Math.max(45,130-n*6))};go()},380)});
$('#panel').addEventListener('pointermove',e=>{if(pd&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>10){clearTimeout(pd.timer);pd=null}});
function endPd(e,cancel){panelDown=false;if(pd){clearTimeout(pd.timer);if(!pd.fired&&!cancel)act(pd.a);pd=null}renderPanel()}
document.addEventListener('pointerup',e=>{if(panelDown)endPd(e,false)});document.addEventListener('pointercancel',e=>{if(panelDown)endPd(e,true)});
function renderPanelForce(){const d=panelDown;panelDown=false;renderPanel();panelDown=d}

// ---------- TOP / BUCLE ----------
function paintTop(){$('#money').textContent=fmtM(S.money)+' €';$('#inc').textContent='+'+fmtM(S.incAvg)+'/s';$('#fame').textContent=Math.floor(S.fame)}
let last=performance.now(),acc=0,uiT=0;
function loop(now){const dt=Math.min(.25,(now-last)/1000);last=now;
  if(!document.hidden){acc+=dt;while(acc>=.05){step(S,R,.05);acc-=.05}stepFx(dt);render();
    uiT+=dt;if(uiT>.35){uiT=0;paintTop();paintBoosts();paintMission();renderPanel()}}
  requestAnimationFrame(loop)}
function catchUp(){const dt=(Date.now()-(S.lastSave||Date.now()))/1000;if(dt<60||!S.incAvg)return;
  const g=Math.round(S.incAvg*Math.min(dt,7200)*.5);if(g<1)return;S.lastSave=Date.now();
  const h=Math.floor(dt/3600),m=Math.floor(dt%3600/60);
  openModal(`<div class="emo">🌙</div><h2>Mientras no estabas…</h2><p style="text-align:center">Tu equipo siguió cocinando ${h?h+' h ':''}${m} min${dt>7200?' (máx. 2 h)':''}.</p><div style="text-align:center;font-family:var(--f-display);font-size:34px;color:#e0862a">+${fmtM(g)} €</div><button class="bigbtn" data-m="offOk" data-g="${g}">¡Cobrar!</button>`)}
MA.offOk=b=>{const g=+b.dataset.g;S.money+=g;S.earned+=g;closeModal();sfx.unlock();burst(VW/2,VH/2,30,'💰');save()};
$('#setBtn').onclick=()=>openSet();
function openSet(){openModal(`<h2>Ajustes</h2>
  <button class="tog ${S.music?'on':''}" data-m="tMusic"><span>🎵 Música</span><i></i></button>
  <button class="tog ${S.sound?'on':''}" data-m="tSound"><span>🔊 Sonido</span><i></i></button>
  <button class="ghost" data-m="help">📖 Cómo se juega</button>
  <button class="ghost" style="color:var(--red)" data-m="wipe">Borrar partida</button>
  <p style="text-align:center;font-size:12px;color:var(--mute)">Franquicia ${S.fr+1} · ${fmtM(S.earned)} € ganados · ${S.served} clientes · v1</p>
  <button class="bigbtn" data-m="close">Seguir</button>`)}
MA.tMusic=()=>{S.music=!S.music;music();openSet();save()};MA.tSound=()=>{S.sound=!S.sound;music();openSet();save()};
MA.wipe=b=>{if(b.dataset.sure){localStorage.removeItem(KEY);S=newState(0);S.seen=1;R=newRuntime(S);hook();dirtyBg=true;closeModal();save();renderPanel();return}b.dataset.sure=1;b.textContent='Toca otra vez para borrarlo todo'};
MA.help=()=>openModal(helpHTML());
function helpHTML(){return`<div class="emo">🍳</div><h2>Guerra de Fogones</h2><ul>
  <li>🧍 La gente pasea por la calle y elige dónde comer: <b>tu local o uno de los 3 rivales</b>.</li>
  <li>🍳 Mejora tus platos: valen más y salen más rápido. En los niveles 10, 25, 50… dan un salto.</li>
  <li>💲 Ajusta precios: barato atrae gente; caro da más dinero, pero si te pasas pierdes fama.</li>
  <li>📉 Cuando un rival se queda sin caja, <b>cierra</b>. Cómpralo en 🏙️ Calle antes de que reabra: tu local crece y ganas platos nuevos.</li>
  <li>🔥📣 Turbo y hora punta gratis cada pocos minutos. Toca las 💰 que aparecen y las cocinas para meter prisa.</li>
  <li>🌙 Tu equipo sigue ganando dinero aunque cierres el juego (hasta 2 h).</li></ul>
  <button class="bigbtn" data-m="close">¡A cocinar!</button>`}

// ---------- ARRANQUE ----------
resize();catchUp();paintTop();paintMission();renderPanel();requestAnimationFrame(loop);
if(!S.seen){S.seen=1;save();setTimeout(()=>openModal(helpHTML()),300)}

</script>

<script>
if('serviceWorker' in navigator){let re=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(re)return;re=true;location.reload()});
navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{const u=()=>r.update().catch(()=>{});u();document.addEventListener('visibilitychange',()=>{if(!document.hidden)u()})}).catch(()=>{})}
</script>
</body>
</html>
