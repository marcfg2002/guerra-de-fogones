<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fogones">
<meta name="theme-color" content="#ff9d5c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}</style>
<title>Guerra de Fogones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: el mapa de la calle a pantalla completa; HUD flotando arriba; misión + dock de botones gordos abajo; fichas que suben desde abajo */
:root{
  --ol:#2a1405; --cream:#fff3d6; --cream2:#f5dfb3;
  --green:#5fd068; --orange:#ffb23f; --red:#ff5a4e; --blue:#4aa8ff; --gold:#ffd84d;
  --f-d:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif; --f-b:'Nunito',-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#ffb86b;background:linear-gradient(#ff9d5c,#ffcf7a 40%,#ffe2a6);color:var(--ol);font-family:var(--f-b);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.out1{color:#fff;text-shadow:-1.5px -1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px 1.5px 0 var(--ol),0 2px 0 var(--ol)}
.out2{color:#fff;text-shadow:-2px -2px 0 var(--ol),2px -2px 0 var(--ol),-2px 2px 0 var(--ol),2px 2px 0 var(--ol),0 4px 0 var(--ol)}
#app{max-width:520px;margin:0 auto;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px;padding-block:6px;box-sizing:border-box;position:relative}
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border-radius:18px}
#cv{display:block;touch-action:none;border-radius:18px;border:3px solid var(--ol);box-shadow:0 5px 0 var(--ol);box-sizing:border-box}
.stage::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;transition:box-shadow .3s}
.stage.turbo::after{box-shadow:inset 0 0 40px 10px rgba(255,120,30,.55)}
.stage.rush::after{box-shadow:inset 0 0 40px 10px rgba(255,230,60,.5)}
.fl{position:absolute;left:0;top:0;font-family:var(--f-d);font-size:17px;pointer-events:none;z-index:3;white-space:nowrap;will-change:transform}
.fl.big{font-size:23px}
.hud{position:absolute;top:0;left:50%;transform:translateX(-50%);width:var(--cw,100%);display:flex;align-items:flex-start;gap:6px;padding:9px;box-sizing:border-box;pointer-events:none;z-index:4}
.hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;background:rgba(42,20,5,.78);border:2.5px solid var(--ol);border-radius:999px;padding:3px 12px 3px 3px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffd84d 45%,#e8a800);border:2.5px solid var(--ol);display:grid;place-items:center;font-family:var(--f-d);font-size:15px;color:#8a5a00;flex-shrink:0}
.cashv{font-family:var(--f-d);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.cashv small{display:block;font-size:11px;font-family:var(--f-b);font-weight:900;color:#ffe9a8;text-shadow:none;margin-top:1px}
.pill.bump .cashv{animation:bump .22s}
@keyframes bump{50%{transform:scale(1.1)}}
.sp{flex:1}
.fpill{padding:3px 10px 3px 3px}.fpill .coin{font-size:15px}
.fpill b{font-family:var(--f-d);font-size:18px;font-weight:400}
.gear{width:40px;height:40px;border-radius:12px;background:var(--cream);border:2.5px solid var(--ol);box-shadow:0 3px 0 var(--ol);font-size:20px;display:grid;place-items:center}
.ticker{position:absolute;left:50%;top:60px;transform:translate(-50%,-8px);opacity:0;background:var(--cream);border:2.5px solid var(--ol);box-shadow:0 3px 0 var(--ol);border-radius:14px;padding:6px 12px;font-weight:900;font-size:12.5px;max-width:84%;text-align:center;transition:.3s;pointer-events:none;z-index:5}
.ticker.on{opacity:1;transform:translate(-50%,0)}
.big{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none}
.big div{font-family:var(--f-d);font-size:31px;text-align:center;line-height:1.05;padding:0 14px;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
.big div small{display:block;font-size:15px;font-family:var(--f-b);font-weight:900;margin-top:7px}
.big.fade div{animation:fadeo .5s forwards}
@keyframes slam{from{transform:scale(2.6) rotate(-6deg);opacity:0}}
@keyframes fadeo{to{opacity:0;transform:scale(.9)}}
.mission{flex-shrink:0;display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol);border-radius:16px;padding:5px 6px 5px 6px;min-height:46px;box-sizing:border-box}
.mission .mi{width:34px;height:34px;border-radius:11px;background:var(--orange);border:2.5px solid var(--ol);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.mission .mt{flex:1;min-width:0;font-weight:900;font-size:13px;line-height:1.15}
.mission .pb{height:10px;background:#e9cf9c;border:2px solid var(--ol);border-radius:99px;overflow:hidden;margin-top:3px}
.mission .pb i{display:block;height:100%;background:linear-gradient(#8cf08f,var(--green));transition:width .3s}
.cb{position:relative;font-family:var(--f-d);font-size:16px;line-height:1;color:#fff;border:3px solid var(--ol);border-radius:14px;padding:9px 12px 10px;background:linear-gradient(#7fe487,var(--green) 55%,#46b850);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--ol);text-shadow:0 2px 0 rgba(0,0,0,.35);touch-action:none;white-space:nowrap}
.cb small{display:block;font-size:12.5px;margin-top:3px;font-family:var(--f-d)}
.cb:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 1px 0 var(--ol)}
.cb.o{background:linear-gradient(#ffd27a,var(--orange) 55%,#f59a24)}
.cb.r{background:linear-gradient(#ff8a7f,var(--red) 55%,#e8483c)}
.cb.b{background:linear-gradient(#8ccaff,var(--blue) 55%,#3b93ea)}
.cb.no{background:linear-gradient(#d6c6a8,#bfae8e);color:#f6efe0}
.cb.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.mission .cb{font-size:14px;padding:7px 10px 8px}
.dock{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;gap:6px;align-items:end}
.db{position:relative;background:var(--cream);border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol);border-radius:16px;padding:5px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--f-d);font-size:12.5px;height:60px;justify-content:center}
.db span{font-size:24px;line-height:1.05}
.db:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.db.on{background:var(--orange)}
.db .badge{position:absolute;top:-8px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--red);border:2.5px solid var(--ol);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 4px;animation:pulse 1s infinite}
.db.boost{background:radial-gradient(circle at 50% 25%,#ffe9a0,#ffad3b);overflow:hidden}
.db.big1{height:72px;border-radius:20px}
.db.big1 span{font-size:30px}
.db .cdv{position:absolute;inset:0;background:conic-gradient(rgba(42,20,5,.6) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.db .cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:15px;pointer-events:none}
.db.ready{animation:wob 2.2s infinite}
.db.live{box-shadow:0 0 0 3px #fff,0 0 22px #ff9d2e,0 4px 0 var(--ol)}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--cream);border:3px solid var(--ol);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -5px 0 rgba(42,20,5,.25);padding:8px 12px 12px;max-height:60%;display:flex;flex-direction:column;gap:8px;transform:translateY(110%);transition:transform .28s cubic-bezier(.3,1.2,.5,1);box-sizing:border-box}
.sheet.open{transform:translateY(0)}
.grab{width:46px;height:5px;border-radius:9px;background:#d9be8d;margin:0 auto -2px;flex-shrink:0}
.sh-h{display:flex;align-items:center;gap:10px;flex-shrink:0}
.bigic{width:58px;height:58px;border-radius:16px;background:#fff;border:3px solid var(--ol);box-shadow:0 3px 0 var(--ol);display:grid;place-items:center;font-size:34px;flex-shrink:0}
.sh-h .tt{flex:1;min-width:0}
.sh-h .tt b{display:block;font-family:var(--f-d);font-weight:400;font-size:22px;line-height:1.05}
.sh-h .tt small{font-weight:900;font-size:12px;color:#8a6a40}
.x{width:38px;height:38px;border-radius:12px;background:var(--red);border:3px solid var(--ol);box-shadow:0 3px 0 var(--ol);color:#fff;font-family:var(--f-d);font-size:18px;flex-shrink:0}
.lvl{font-family:var(--f-d);font-size:13px;background:var(--blue);color:#fff;border:2.5px solid var(--ol);border-radius:9px;padding:1px 7px;display:inline-block;margin-left:4px;vertical-align:3px}
.mbar{height:16px;background:#e9cf9c;border:2.5px solid var(--ol);border-radius:99px;overflow:hidden;position:relative;flex-shrink:0}
.mbar i{display:block;height:100%;background:linear-gradient(#9ad7ff,var(--blue))}
.mbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:900}
.chips{display:flex;gap:6px;flex-shrink:0}
.chip{flex:1;background:#fff;border:2.5px solid var(--ol);border-radius:12px;padding:5px 4px;text-align:center;font-weight:900;font-size:11px;color:#8a6a40;line-height:1.15}
.chip b{display:block;font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--ol)}
.prow{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--ol);border-radius:14px;padding:5px 6px;flex-shrink:0}
.prow .pl{flex:1;min-width:0;font-weight:900;font-size:12px;line-height:1.2}
.pm{width:40px;height:40px;border-radius:12px;font-family:var(--f-d);font-size:24px;color:#fff;border:3px solid var(--ol);box-shadow:0 3px 0 var(--ol);background:var(--blue);touch-action:none;flex-shrink:0}
.pm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
.pv{min-width:72px;text-align:center;line-height:1.05}
.pv b{font-family:var(--f-d);font-weight:400;font-size:19px;display:block}
.pv small{font-weight:900;font-size:11px}
.g{color:#2f9e44}.o{color:#e0801a}.rr{color:#d8352a}.bb{color:#1f6fcc}
.dem{display:flex;gap:2px;margin-top:3px}.dem i{flex:1;height:7px;border-radius:3px;background:#eadbbf;border:1px solid rgba(42,20,5,.25)}.dem i.on{background:var(--green)}
.seg{display:flex;background:#e9cf9c;border:2.5px solid var(--ol);border-radius:12px;padding:2px;gap:2px}
.seg button{padding:5px 10px;border-radius:9px;font-family:var(--f-d);font-size:13px;color:#8a6a40}
.seg button.on{background:#fff;color:var(--ol);box-shadow:0 2px 0 rgba(42,20,5,.4)}
.uprow{display:flex;gap:8px;align-items:center;flex-shrink:0}
.uprow .cb{flex:1;font-size:21px;padding:11px 10px 12px}
.list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 2px 6px}
.it{display:flex;align-items:center;gap:9px;background:#fff;border:2.5px solid var(--ol);border-radius:14px;padding:6px 7px;box-shadow:0 3px 0 rgba(42,20,5,.35);flex-shrink:0}
.it .ic{font-size:28px;width:34px;text-align:center;flex-shrink:0}
.it .tx{flex:1;min-width:0;line-height:1.2}
.it .tx b{font-family:var(--f-d);font-weight:400;font-size:16px;display:block}
.it .tx small{font-weight:900;font-size:11.5px;color:#8a6a40;display:block}
.it .cb{font-size:14px;padding:7px 10px 8px;min-width:86px;text-align:center}
.it .pm{width:34px;height:34px;font-size:20px}
.it .pv{min-width:62px}.it .pv b{font-size:16px}
.hp{height:10px;border-radius:99px;background:#eadbbf;border:2px solid var(--ol);overflow:hidden;margin-top:3px}.hp i{display:block;height:100%;transition:width .5s}
.share{display:flex;height:28px;border-radius:12px;overflow:hidden;border:2.5px solid var(--ol);flex-shrink:0}
.share div{display:grid;place-items:center;font-family:var(--f-d);font-size:12.5px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45);min-width:0;overflow:hidden;transition:flex .5s}
.note{font-size:12px;font-weight:900;color:#8a6a40;line-height:1.35;margin:0}
.toast{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--cream);border:2.5px solid var(--ol);box-shadow:0 3px 0 var(--ol);padding:8px 14px;border-radius:14px;font-weight:900;max-width:min(90vw,400px);text-align:center;transition:.25s;z-index:60;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(42,20,5,.55);display:grid;place-items:center;z-index:50;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.card{background:var(--cream);border:3px solid var(--ol);box-shadow:0 6px 0 var(--ol);border-radius:24px;padding:18px 16px 16px;width:min(100%,380px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:11px;animation:rise .3s cubic-bezier(.3,1.4,.5,1);box-sizing:border-box}
@keyframes rise{from{transform:translateY(24px) scale(.92);opacity:0}}
.card h2{font-family:var(--f-d);font-weight:400;font-size:28px;text-align:center;margin:0;line-height:1.05}
.card p{margin:0;line-height:1.4;font-weight:800;text-align:center}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.card li{background:#fff;border:2px solid var(--ol);border-radius:12px;padding:7px 10px;font-weight:800;line-height:1.3;font-size:13px}
.card .cb{font-size:20px;padding:12px}
.emo{font-size:52px;text-align:center;line-height:1}
.tog{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2.5px solid var(--ol);border-radius:14px;padding:10px 12px;font-family:var(--f-d);font-size:16px;width:100%;box-sizing:border-box}
.tog i{width:46px;height:28px;border-radius:99px;background:#d9c6a3;border:2.5px solid var(--ol);position:relative;box-sizing:border-box}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid var(--ol);transition:.2s;box-sizing:border-box}
.tog.on i{background:var(--green)}.tog.on i::after{left:19px}
.lnk{font-family:var(--f-d);font-size:15px;text-align:center;color:#8a6a40;padding:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud">
      <div class="pill" id="cashBox"><span class="coin">€</span><span class="cashv out1" id="money">0<small id="inc">+0/s</small></span></div>
      <span class="sp"></span>
      <div class="pill fpill"><span class="coin">⭐</span><b class="out1" id="fame">0</b></div>
      <button class="gear" id="setBtn" aria-label="Ajustes">⚙️</button>
    </div>
    <div class="ticker" id="ticker"></div>
    <div class="big" id="big" hidden></div>
  </div>
  <div class="mission" id="mission"></div>
  <nav class="dock">
    <button class="db" data-sheet="equipo"><span>👨‍🍳</span>Equipo</button>
    <button class="db" data-sheet="precios"><span>🏷️</span>Precios</button>
    <button class="db boost big1" id="bTurbo"><span>🔥</span><b class="out1" style="font-weight:400">TURBO</b><i class="cdv"></i><i class="cdt out1"></i></button>
    <button class="db" data-sheet="calle"><span>🏙️</span>Calle</button>
    <button class="db boost" id="bRush"><span>📣</span>Gentío<i class="cdv"></i><i class="cdt out1"></i></button>
  </nav>
  <div class="sheet" id="sheet"></div>
</div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>
<script src="three.min.js"></script>
<script>
// ================= GUERRA DE FOGONES · simulación =================
const VW=400,VH=500,STREET=134,SIDE_Y=77,ZW=100;
const DISH={
  soda:{e:'🥤',n:'Refresco',p:5,t:1.6,unlock:0},
  fries:{e:'🍟',n:'Patatas',p:12,t:2.6,unlock:60},
  burger:{e:'🍔',n:'Hamburguesa',p:30,t:4,unlock:600},
  wine:{e:'🍷',n:'Vino',p:22,t:2.2,unlock:900},
  pizza:{e:'🍕',n:'Pizza',p:40,t:5,unlock:2500},
  pasta:{e:'🍝',n:'Pasta',p:60,t:5.5,unlock:6000},
  tea:{e:'🍵',n:'Té matcha',p:110,t:2.4,unlock:2.2e4},
  sushi:{e:'🍣',n:'Sushi',p:180,t:5,unlock:6e4},
  ramen:{e:'🍜',n:'Ramen',p:260,t:6,unlock:1.4e5},
  marga:{e:'🍹',n:'Margarita',p:450,t:3,unlock:5e5},
  taco:{e:'🌮',n:'Tacos',p:700,t:4.5,unlock:1.2e6},
  burrito:{e:'🌯',n:'Burrito',p:1000,t:6,unlock:2.8e6}};
const ZONES=[
  {name:'Tu local',e:'🥤',col:'#f2a541',dishes:['soda','fries','burger']},
  {name:'Mamma Mia',e:'🍕',col:'#d1495b',dishes:['wine','pizza','pasta'],cash:300,base:1.1,runway:200,buy:2500},
  {name:'Sushi Zen',e:'🍣',col:'#3a86c8',dishes:['tea','sushi','ramen'],cash:2e4,base:1.9,runway:420,buy:2.5e4},
  {name:'El Güey',e:'🌮',col:'#3bb273',dishes:['marga','taco','burrito'],cash:1e6,base:2.6,runway:700,buy:2.5e5}];
const MILES=[10,25,50,75,100,150,200,300];
const milesOf=L=>MILES.filter(m=>L>=m).length;
const qual=L=>0.62*Math.log2(1+L);
const fairOf=(d,L)=>DISH[d].p*(1+0.11*(L-1))*Math.pow(1.8,milesOf(L));
const cookOf=(d,L)=>DISH[d].t/(1+0.45*milesOf(L));
const upCost=(d,L)=>Math.ceil(DISH[d].p*1.3*Math.pow(1.115,L-1)*(1+0.15*milesOf(L)));
const chefCost=n=>Math.ceil(60*Math.pow(3.2,n-1));
const seatCost=n=>Math.ceil(400*Math.pow(6,n-4));
const speedCost=n=>Math.ceil(150*Math.pow(2.6,n));
const fmtM=n=>{n=Math.floor(n);if(n<1e4)return n.toLocaleString('es-ES');const u=['K','M','B','T','aa','ab','ac'];let i=-1;while(n>=1e3&&i<u.length-1){n/=1e3;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0)).replace('.',',')+u[i]};

function newState(fr=0){
  const st={};for(const k in DISH)st[k]={lvl:0,r:1};st.soda.lvl=1;
  return{v:1,money:30,fame:0,fr,st,chefs:1,speed:0,seats:4,
    zones:ZONES.map((z,i)=>i===0?{own:1}:{own:0,open:1,cash:z.cash*(1+fr*3),lvl:0,r:1,closedAt:0}),

// ---- geometría (coordenadas virtuales) ----
function zoneGeo(j){const x0=j*ZW,cx=x0+ZW/2,y0=STREET,h=VH-STREET;
  const ty=[y0+.2*h,y0+.36*h,y0+.52*h];
  const seats=[];ty.forEach(y=>{seats.push({x:cx-27,y},{x:cx+27,y})});
  return{x0,cx,y0,h,door:{x:cx,y:y0+12},seats,tables:ty,counterY:y0+.71*h,stations:[0,1,2].map(k=>({x:x0+ZW*(k*2+1)/6,y:y0+.86*h})),home:{x:cx,y:y0+.66*h}}}
const GEO=[0,1,2,3].map(zoneGeo);

// ---- runtime ----
function newRuntime(S){
  const R={custs:[],chefs:[],orders:[],floats:[],bags:[],spawnAcc:0,passAcc:0,t:0,tick:0,
    seats:GEO.map(g=>g.seats.map(()=>null)),stationBusy:{},events:[],news:[],turbo:0,rush:0,rivalSvc:[0,7,8,9],
    salesWin:[],incWin:0,incT:0,critic:0,lastBag:0};

function mkChef(S,i){const owned=S.zones.map((z,j)=>z.own?j:-1).filter(j=>j>=0);const g=GEO[owned[i%owned.length]];
  return{x:g.home.x+(i%3-1)*14,y:g.home.y,state:'idle',order:null,prog:0,carry:null,bob:Math.random()*6}}
const ownedZones=S=>S.zones.map((z,j)=>z.own?j:-1).filter(j=>j>=0);
const myDishes=S=>Object.keys(DISH).filter(d=>S.st[d].lvl>0&&ownedZones(S).some(j=>ZONES[j].dishes.includes(d)));
function stationPos(d){for(let j=0;j<4;j++){const k=ZONES[j].dishes.indexOf(d);if(k>=0)return{...GEO[j].stations[k],j,k}}}
const seatCap=(S,j)=>S.zones[j].own?S.seats:4;
function gumbel(){return-Math.log(-Math.log(Math.random()+1e-9)+1e-9)}

const rivalCash0=(j,S)=>ZONES[j].cash*(1+S.fr*3);
const rivalFixed=(j,S)=>rivalCash0(j,S)/ZONES[j].runway;
function myUtil(S,R,d){const s=S.st[d];return qual(s.lvl)+0.005*S.fame+(R.ad>0?0.5:0)+0.07*(myDishes(S).length-1)-2.4*(s.r-1)}
function rivalUtil(S,j){const z=S.zones[j];return ZONES[j].base+0.2*z.lvl+0.15*S.fr-2.4*(z.r-1)}

function freeSeat(S,R,j){const cap=seatCap(S,j);for(let k=0;k<cap;k++)if(!R.seats[j][k])return k;return-1}
function spawnCustomer(S,R,opts={}){
  const side=Math.random()<.5,x=side?-12:VW+12;
  const c={x,y:SIDE_Y+(Math.random()*10-5),dir:side?1:-1,e:CUST[Math.floor(Math.random()*CUST.length)],state:'walk',target:-1,seat:-1,dish:null,wait:0,mood:'',vip:!!opts.vip,speed:78+Math.random()*20};
  // decidir
  let best=0+gumbel(),pick=null;
  const mySeatZ=ownedZones(S).map(j=>[j,freeSeat(S,R,j)]).filter(a=>a[1]>=0);
  const md=myDishes(S);
  if(mySeatZ.length&&md.length){for(const d of md){const u=myUtil(S,R,d)+gumbel()+(c.vip?0.5:0);if(u>best){best=u;pick={me:1,d}}}}
  let hurt=false;
  for(let j=1;j<4;j++){const z=S.zones[j];if(z.own||!z.open)continue;const k=freeSeat(S,R,j);if(k<0)continue;
    const u=rivalUtil(S,j)+gumbel();if(u>best){best=u;pick={j}}}
  if(pick&&pick.me){
    // elige la zona libre más cercana a la puerta por la que pasa
    const [j,k]=mySeatZ.sort((a,b)=>Math.abs(GEO[a[0]].cx-x)-Math.abs(GEO[b[0]].cx-x))[0];
    c.target=j;c.seat=k;c.dish=pick.d;R.seats[j][k]=c;c.state='toDoor';
  }else if(pick){const j=pick.j,k=freeSeat(S,R,j);c.target=j;c.seat=k;R.seats[j][k]=c;c.state='toDoor';
    c.dish=ZONES[j].dishes[Math.floor(Math.random()*3)]}
  else{if(md.length&&md.some(d=>S.st[d].r>1.35))c.mood='💸';}

const CUST=['🧑','👩','👨','🧔','👵','👴','👧','👦','🧑‍🦱','👩‍🦰','👨‍🦳','🧕','👱‍♀️','🧑‍🦰','👲'];

function moveTo(o,tx,ty,sp,dt){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d<=sp*dt){o.x=tx;o.y=ty;return true}o.x+=dx/d*sp*dt;o.y+=dy/d*sp*dt;return false}

function earn(S,R,amt,x,y,txt){S.money+=amt;S.earned+=amt;R.incWin+=amt;R.floats.push({x,y,t:0,txt:txt||('+'+fmtM(amt)),col:'#ffd166'});if(R.onCoin)R.onCoin()}

function step(S,R,dt){
  R.t+=dt;R.tick++;
  if(R.turbo>0)R.turbo-=dt;if(R.rush>0)R.rush-=dt;if(R.ad>0)R.ad-=dt;
  // ritmo de llegada
  const lam=(0.6+0.0015*S.fame+0.12*(ownedZones(S).length-1))*(R.rush>0?2.6:1);
  R.spawnAcc+=dt*lam;while(R.spawnAcc>=1){R.spawnAcc-=1;spawnCustomer(S,R)}
  // crítico ocasional
  R.critic-=dt;if(R.critic<=0){R.critic=90+Math.random()*90;if(S.served>15){const c=spawnCustomer(S,R,{vip:true});c.e='🧐';c.vip=true;if(R.onNews)R.onNews('🧐 ¡Ha llegado un crítico gastronómico a la calle!')}}
  // clientes
  for(const c of R.custs){
    const g=c.target>=0?GEO[c.target]:null;
    switch(c.state){
      case 'walk':c.x+=c.dir*c.speed*dt;if(c.x<-20||c.x>VW+20)c.dead=1;break;
      case 'toDoor':if(moveTo(c,g.door.x,SIDE_Y,c.speed,dt))c.state='enter';break;
      case 'enter':if(moveTo(c,g.door.x,g.door.y,c.speed,dt))c.state='toSeat';break;
      case 'toSeat':{const s=g.seats[c.seat];if(moveTo(c,s.x,s.y,c.speed,dt)){c.state='seated';c.wait=0;
        if(S.zones[c.target].own)R.orders.push({c,d:c.dish,state:'new'});else c.svc=R.rivalSvc[c.target]*(0.8+Math.random()*.4)}}break;
      case 'seated':c.wait+=dt;
        if(!S.zones[c.target].own){if(c.wait>=c.svc){rivalSale(S,R,c.target);c.state='eat';c.eat=1.6;c.food=ZONES[c.target].dishes[Math.floor(Math.random()*3)]}}
        else if(c.wait>32){c.mood='😡';S.fame=Math.max(0,S.fame-2.5);leave(S,R,c);if(R.onAngry)R.onAngry()}
        break;
      case 'eat':c.eat-=dt;if(c.eat<=0)leave(S,R,c);break;
      case 'out':if(moveTo(c,g.door.x,g.door.y,c.speed,dt))c.state='up';break;
      case 'up':if(moveTo(c,g.door.x,SIDE_Y,c.speed,dt)){c.state='walk';c.target=-1}break;
    }
  }
  R.custs=R.custs.filter(c=>!c.dead);
  // cocineros
  const sp=(95+13*S.speed)*(R.turbo>0?1.8:1);
  for(const ch of R.chefs){
    switch(ch.state){
      case 'idle':{const o=R.orders.find(o=>o.state==='new');
        if(o){o.state='taken';ch.order=o;ch.state='toStation';ch.st=stationPos(o.d)}
        else{const owned=ownedZones(S),g=GEO[owned[R.chefs.indexOf(ch)%owned.length]];moveTo(ch,g.home.x+(R.chefs.indexOf(ch)%3-1)*16,g.home.y,sp*.5,dt)}}break;
      case 'toStation':if(cancelled(ch,R))break;
        if(moveTo(ch,ch.st.x,ch.st.y-24,sp,dt)){const key=ch.order.d;if(!R.stationBusy[key]){R.stationBusy[key]=ch;ch.state='cook';ch.prog=0}}break;
      case 'cook':{const d=ch.order.d,L=S.st[d].lvl;ch.prog+=dt/cookOf(d,L)*(R.turbo>0?2:1);
        if(ch.prog>=1){R.stationBusy[d]=null;if(cancelled(ch,R))break;ch.state='deliver';ch.carry=DISH[d].e}}break;
      case 'deliver':if(cancelled(ch,R))break;{const c=ch.order.c,g=GEO[c.target],s=g.seats[c.seat];
        if(moveTo(ch,s.x+(s.x<g.cx?16:-16),s.y-4,sp,dt)){serve(S,R,c);ch.order.state='done';ch.order=null;ch.carry=null;ch.state='idle'}}break;
    }
  }
  R.orders=R.orders.filter(o=>o.state!=='done'&&o.state!=='x');
  // rivales
  if(R.tick%10===0)rivalTick(S,R,dt*10);
  // flotantes
  for(const f of R.floats){f.t+=dt;f.y-=22*dt}R.floats=R.floats.filter(f=>f.t<1.1);
  // bolsas de dinero
  if(R.t-R.lastBag>40&&Math.random()<dt/25){R.lastBag=R.t;const j=ownedZones(S)[Math.floor(Math.random()*ownedZones(S).length)],g=GEO[j];R.bags.push({x:g.x0+20+Math.random()*60,y:g.y0+40+Math.random()*(g.h*.5),t:0})}
  for(const b of R.bags)b.t+=dt;R.bags=R.bags.filter(b=>b.t<12);
  // ingresos medios
  R.incT+=dt;if(R.incT>=5){const inst=R.incWin/R.incT;S.incAvg=S.incAvg?S.incAvg*.8+inst*.2:inst;R.incWin=0;R.incT=0}
}
function cancelled(ch,R){if(ch.order&&ch.order.state==='x'){if(ch.state==='cook')R.stationBusy[ch.order.d]=null;ch.order=null;ch.carry=null;ch.state='idle';return true}return false}
function leave(S,R,c){const j=c.target;if(j>=0&&R.seats[j][c.seat]===c)R.seats[j][c.seat]=null;

function serve(S,R,c){const d=c.dish,s=S.st[d],fair=fairOf(d,s.lvl),price=fair*s.r*(1+S.fr);

  else if(fast){S.fame=Math.min(400,S.fame+(c.vip?12:0.45));c.mood=c.vip?'🤩':'😋'}
  else{S.fame=Math.min(400,S.fame+0.15);c.mood='🙂'}
  if(c.vip&&R.onNews)R.onNews(c.wait<20?'🧐 El crítico sale encantado: +12 de fama':'🧐 El crítico se ha ido regular');

    const share=R.salesWin.filter(s=>s.j===j).length/tot;
    z.cash-=rivalFixed(j,S)*dt;

      if(R.salesWin.length>6){

function syncFloats(){const r=stageEl.getBoundingClientRect(),cr=cv.getBoundingClientRect(),seen=new Set();
  for(const f of R.floats){seen.add(f);let el=FL.get(f);if(!el){el=document.createElement('div');el.className='fl out1'+(f.big?' big':'');el.textContent=f.txt;el.style.color=f.col||'#ffd84d';stageEl.appendChild(el);FL.set(f,el)}
    tmpV.set(Wx(f.x),2.2+f.t*1.4,Wz(f.y+f.t*22));tmpV.project(camera);
    el.style.transform=`translate(${(tmpV.x+1)/2*cr.width+(cr.left-r.left)}px,${(1-tmpV.y)/2*cr.height+(cr.top-r.top)}px) translate(-50%,-50%)`;el.style.opacity=Math.max(0,1-f.t/1.1)}
  for(const [k,el] of FL)if(!seen.has(k)){el.remove();FL.delete(k)}}

let camX=-4,camZ=0,camXT=-4,camZT=0;const VIS_W=11.5;
function camPose(c,x,z){const d=camBase.d,p=camBase.pitch;c.position.set(x,Math.sin(p)*d,z+Math.cos(p)*d);c.lookAt(x,0,z);c.updateMatrixWorld();c.updateProjectionMatrix()}
function fitCam(){camBase.pitch=.86;let lo=5,hi=80;for(let i=0;i<30;i++){const mid=(lo+hi)/2;camBase.d=mid;camPose(camera,0,0);tmpV.set(VIS_W/2,0,0).project(camera);if(tmpV.x<=1)hi=mid;else lo=mid}camBase.d=hi;
  // límites verticales: que se pueda ver desde la carretera hasta el fondo
  zMin=Wz(30);zMax=Wz(VH)-1.5;clampCam()}
let zMin=-8,zMax=8;
function clampCam(){const xm=10-VIS_W/2+.9;camXT=Math.max(-xm,Math.min(xm,camXT));camZT=Math.max(zMin+5,Math.min(zMax,camZT))}
function homeCam(){const own=ownedZones(S);const cxs=own.map(j=>Wx(GEO[j].cx));camXT=(Math.min(...cxs)+Math.max(...cxs))/2;camZT=Wz(STREET+(VH-STREET)*.6);clampCam()}
function resize(){const r=stageEl.getBoundingClientRect();renderer.setSize(r.width,r.height,false);cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  camera.aspect=r.width/r.height;fitCam();stageEl.style.setProperty('--cw',r.width+'px');SC=r.width/VW}
addEventListener('resize',resize);
const tmpC=new THREE.PerspectiveCamera();
let sheetCamSaved=null;
function updCam(){if(sheetKind!=='st')return;const st=stageEl.getBoundingClientRect(),sh=$('#sheet').getBoundingClientRect();
  const limit=1-2*((sh.top-st.top-30)/st.height);const p=stationPos(sheetArg);tmpC.copy(camera);const x=Math.max(-(10-VIS_W/2+.4),Math.min(10-VIS_W/2+.4,Wx(p.x)));
  for(let z=Wz(p.y)-12;z<=Wz(p.y)+8;z+=.2){camPose(tmpC,x,z);tmpV.set(Wx(p.x),0,Wz(p.y)+.6).project(tmpC);if(tmpV.y>=limit+.04){camXT=x;camZT=z;return}}}
let T3=0;
function render(){if(dirtyBg){buildStatic();STN.forEach(o=>scene.remove(o.g));STN.clear()}
  T3+=1/60;camX+=(camXT-camX)*.2;camZ+=(camZT-camZ)*.2;camPose(camera,camX,camZ);
  buildStations(T3);animStations(T3);syncEnts(R.t);syncBags(T3);syncFloats();

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function tapAt(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const bagObjs=[...BAGS.values()].map(o=>o.children[0]);let hit=ray.intersectObjects(bagObjs,false)[0];
  if(hit){const b=hit.object.userData.bag;const amt=Math.max(25,S.incAvg*20);b.t=99;S.money+=amt;S.earned+=amt;R.floats.push({x:b.x,y:b.y-12,t:0,txt:'+'+fmtM(amt),col:'#ffd84d',big:1});burst(b.x,b.y,18);sfx.unlock();return}
  hit=ray.intersectObjects(hitList,false)[0];
  if(hit){const d=hit.object.userData.station,ch=R.stationBusy[d];
    if(ch&&ch.state==='cook'&&sheetKind==='st'&&sheetArg===d){ch.prog=Math.min(.999,ch.prog+.25);const p=stationPos(d);burst(p.x,p.y-10,6);sfx.tap();R.floats.push({x:p.x,y:p.y-20,t:0,txt:'¡Rápido!',col:'#fff'});return}
    S.flags.tapped=1;openSheet('st',d);return}
  hit=ray.intersectObjects(staticG?staticG.children.filter(o=>o.userData&&o.userData.zone!=null):[],false)[0];
  if(hit){const j=hit.object.userData.zone,z=S.zones[j];if(!z.own&&!z.open){openSheet('calle');return}}
  if(sheetKind)closeSheet()}

  const k=VIS_W/cv.getBoundingClientRect().width;camXT=drag3.cx-dx*k;camZT=drag3.cz-dy*k*1.25;clampCam();camX=camXT;camZ=camZT});

function upPlan(d){const s=S.st[d];let n=0,cost=0,L=s.lvl,money=S.money;
  if(buyMode==='max'){while(money>=upCost(d,L)){const c=upCost(d,L);money-=c;cost+=c;L++;n++;if(n>500)break}if(n===0){n=1;cost=upCost(d,s.lvl)}}
  else{for(let i=0;i<buyMode;i++){cost+=upCost(d,L);L++;n++}}return{n,cost}}
const MS=[10,25,50,75,100,150,200,300];
const nextMile=L=>MS.find(m=>m>L)||L+100;
const prevMile=L=>{let p=0;for(const m of MS)if(m<=L)p=m;return p};
function priceLabel(r){return r<.8?['¡Ganga!','bb']:r<=1.05?['Justo','g']:r<=1.3?['Caro','o']:['Abusivo','rr']}
function demand(d){const md=myDishes(S);let me=Math.exp(myUtil(S,R,d)),tot=1+md.reduce((a,x)=>a+Math.exp(myUtil(S,R,x)),0);
  for(let j=1;j<4;j++){const z=S.zones[j];if(!z.own&&z.open)tot+=Math.exp(rivalUtil(S,j))}return me/tot}
function shares(){const w=R.salesWin.filter(s=>R.t-s.t<40),tot=w.length||1;return[0,1,2,3].map(j=>w.filter(s=>s.j===j).length/tot)}

function act(a){const [k,x,y]=a.split(':');
  if(k==='close'){closeSheet();return false}
  if(k==='mode'){buyMode=x==='max'?'max':+x;sfx.tap();return true}
  if(k==='up'){const pl=upPlan(x);if(S.money<pl.cost){sfx.bad();return false}const before=S.st[x].lvl;S.money-=pl.cost;S.st[x].lvl+=pl.n;sfx.up(S.st[x].lvl%24);
    const p=stationPos(x);R.floats.push({x:p.x,y:p.y-34,t:0,txt:'Nv '+S.st[x].lvl,col:'#9ad7ff',big:1});burst(p.x,p.y-12,6);
    if(nextMile(before)<=S.st[x].lvl){bigText(`${DISH[x].e} ¡NIVEL ${prevMile(S.st[x].lvl)}!`,'Más rápido y más caro');burst(p.x,p.y,24,DISH[x].e);sfx.unlock()}return true}
  if(k==='unlock'){const D=DISH[x];if(S.money<D.unlock){sfx.bad();return false}S.money-=D.unlock;S.st[x].lvl=1;const p=stationPos(x);burst(p.x,p.y,26,D.e);bigText(`${D.e} ¡${D.n.toUpperCase()}!`,'Nuevo plato en la carta');sfx.unlock();return true}
  if(k==='price'){const s=S.st[x];s.r=Math.round(Math.max(.5,Math.min(2,s.r+(+y)*.05))*100)/100;S.flags.priced=1;sfx.tap();return true}
  if(k==='chef'){const c=chefCost(S.chefs);if(S.chefs>=maxChefs()||S.money<c){sfx.bad();return false}S.money-=c;S.chefs++;const ch=mkChef(S,R.chefs.length);R.chefs.push(ch);burst(ch.x,ch.y,14,'🧑‍🍳');sfx.unlock();return true}
  if(k==='speed'){const c=speedCost(S.speed);if(S.money<c||S.speed>=10){sfx.bad();return false}S.money-=c;S.speed++;sfx.up(S.speed);return true}
  if(k==='seats'){const c=seatCost(S.seats);if(S.money<c||S.seats>=6){sfx.bad();return false}S.money-=c;S.seats++;dirtyBg=true;sfx.unlock();return true}
  if(k==='ad'){const c=adCost();if(S.money<c||R.ad>0){sfx.bad();return false}S.money-=c;R.ad=60;news('🎈 ¡Tu cartel gigante atrae miradas!');sfx.boost();return true}
  if(k==='buy'){const j=+x;if(!buyZone(S,R,j)){sfx.bad();return false}dirtyBg=true;const g=GEO[j];closeSheet();
    camXT=Wx(g.cx);clampCam();bigText(`${ZONES[j].e} ¡LOCAL COMPRADO!`,'¡Pared fuera! Tu restaurante crece');sfx.big();for(let i=0;i<4;i++)setTimeout(()=>burst(g.cx,STREET+60+i*90,26,'🎉'),i*220);save();return true}
  if(k==='fran'){openModal(`<div class="emo">🏢</div><h2>¿Abrir franquicia?</h2><p>Vendes la calle y empiezas otra desde cero. Ganarás <b>x${S.fr+2}</b> por plato para siempre, pero los rivales serán más duros.</p><button class="cb" data-m="franOk">¡FRANQUICIAR!</button><button class="lnk" data-m="close">Todavía no</button>`);return false}
  return false}
MA.franOk=()=>{if(S.money<franCost())return;const fr=S.fr+1,keep={sound:S.sound,music:S.music,mis:S.mis,seen:1};S=newState(fr);Object.assign(S,keep);S.flags={tapped:1};R=newRuntime(S);hook();dirtyBg=true;closeModal();closeSheet();bigText('🏢 ¡FRANQUICIA '+(fr+1)+'!','Nueva calle, más dinero, rivales más duros');sfx.big();save()};
let pd=null;
$('#sheet').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a]');pressing=true;if(!b)return;
  pd={a:b.dataset.a,hold:!!b.dataset.hold,x:e.clientX,y:e.clientY,fired:false};
  if(pd.hold)pd.timer=setTimeout(()=>{if(!pd)return;pd.fired=true;let n=0;const go=()=>{if(!pd)return;if(act(pd.a)){n++;renderSheet(true)}pd.timer=setTimeout(go,Math.max(45,130-n*6))};go()},380)});
$('#sheet').addEventListener('pointermove',e=>{if(pd&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>10){clearTimeout(pd.timer);pd=null}});
function endPd(cancel){pressing=false;if(pd){clearTimeout(pd.timer);const a=pd.a,f=pd.fired;pd=null;if(!f&&!cancel)act(a)}renderSheet(true)}
document.addEventListener('pointerup',()=>{if(pressing)endPd(false)});document.addEventListener('pointercancel',()=>{if(pressing)endPd(true)});

// ---------- BUCLE ----------
function paintTop(){$('#money').firstChild.textContent=fmtM(S.money)+' €';$('#inc').textContent='+'+fmtM(S.incAvg)+' €/s';$('#fame').textContent=Math.floor(S.fame);
  const closed=[1,2,3].some(j=>!S.zones[j].own&&!S.zones[j].open);const cb=document.querySelector('.dock [data-sheet="calle"]');let bd=cb.querySelector('.badge');
  if(closed&&!bd){bd=document.createElement('i');bd.className='badge';bd.textContent='!';cb.appendChild(bd)}else if(!closed&&bd)bd.remove()}
let last=performance.now(),acc=0,uiT=0;
function loop(now){const dt=Math.min(.25,(now-last)/1000);last=now;
  if(!document.hidden){acc+=dt;while(acc>=.05){step(S,R,.05);acc-=.05}stepFx(dt);render();
    uiT+=dt;if(uiT>.3){uiT=0;paintTop();paintBoosts();paintMission();renderSheet();if(sheetKind==='st')updCam()}}
  requestAnimationFrame(loop)}
function catchUp(){const dt=(Date.now()-(S.lastSave||Date.now()))/1000;if(dt<60||!S.incAvg)return;
  const g=Math.round(S.incAvg*Math.min(dt,7200)*.5);if(g<1)return;S.lastSave=Date.now();
  const h=Math.floor(dt/3600),m=Math.floor(dt%3600/60);
  openModal(`<div class="emo">🌙</div><h2>Mientras no estabas…</h2><p>Tu equipo siguió cocinando ${h?h+' h ':''}${m} min${dt>7200?' (máx. 2 h)':''}.</p><div style="text-align:center;font-family:var(--f-d);font-size:38px" class="out2">+${fmtM(g)} €</div><button class="cb" data-m="offOk" data-g="${g}">¡COBRAR!</button>`)}
MA.offOk=b=>{const g=+b.dataset.g;S.money+=g;S.earned+=g;closeModal();sfx.unlock();burst(VW/2,VH*.4,30,'💰');save()};
$('#setBtn').onclick=()=>openSet();
function openSet(){openModal(`<h2>Ajustes</h2>
  <button class="tog ${S.music?'on':''}" data-m="tMusic"><span>🎵 Música</span><i></i></button>
  <button class="tog ${S.sound?'on':''}" data-m="tSound"><span>🔊 Sonido</span><i></i></button>
  <button class="cb b" data-m="help">CÓMO SE JUEGA</button>
  <p style="font-size:12px;color:#8a6a40">Franquicia ${S.fr+1} · ${fmtM(S.earned)} € ganados · ${S.served} clientes</p>
  <button class="lnk" style="color:#d8352a" data-m="wipe">Borrar partida</button>
  <button class="cb" data-m="close">SEGUIR</button>`)}
MA.tMusic=()=>{S.music=!S.music;music();openSet();save()};MA.tSound=()=>{S.sound=!S.sound;music();openSet();save()};
MA.wipe=b=>{if(b.dataset.sure){localStorage.removeItem(KEY);S=newState(0);S.seen=1;R=newRuntime(S);hook();dirtyBg=true;closeModal();closeSheet();save();return}b.dataset.sure=1;b.textContent='Toca otra vez para borrarlo todo'};
MA.help=()=>openModal(helpHTML());
function helpHTML(){return`<div class="emo">🍳🔥</div><h2>Guerra de Fogones</h2><ul>
  <li>🧍 La gente pasea por la calle y elige dónde comer: <b>en tu local o en uno de los 3 rivales</b>.</li>
  <li>✋ <b>Arrastra el dedo</b> por el mapa para moverte por la calle.</li>
  <li>👆 <b>Toca una cocina</b> para mejorarla y ponerle precio. Las flechas verdes ⬆ dicen qué puedes mejorar.</li>
  <li>🏷️ Barato atrae gente; caro da más dinero, pero si te pasas pierdes fama.</li>
  <li>📉 Si un rival se queda sin caja, <b>cierra</b>. Cómpralo en 🏙️ Calle y tu restaurante crece.</li>
  <li>🔥 Turbo y 📣 gentío gratis cada pocos minutos. Toca las 💰 del suelo.</li>
  <li>🌙 Tu equipo sigue ganando aunque cierres el juego (hasta 2 h).</li></ul>
  <button class="cb" data-m="close">¡A COCINAR!</button>`}

resize();homeCam();camX=camXT;camZ=camZT;catchUp();paintTop();paintMission();requestAnimationFrame(loop);
if(!S.seen){S.seen=1;save();setTimeout(()=>openModal(helpHTML()),300)}

</script>

<script>
if('serviceWorker' in navigator){let re=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(re)return;re=true;location.reload()});
navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{const u=()=>r.update().catch(()=>{});u();document.addEventListener('visibilitychange',()=>{if(!document.hidden)u()})}).catch(()=>{})}
</script>
